<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FabricBill</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/product.css">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

  <div class="container">

    <!-- Navbar -->
    <div class="navbar">

      <div class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-scissors"></i>
        </div>

        <div class="logo-text">
          <h2>FabricBill</h2>
          <p>Cloth Billing System</p>
        </div>
      </div>

      <!-- PRODUCTS PAGE NAVBAR -->

<div class="menu">

  <a href="index.html">
    <i class="fa-solid fa-house"></i>
    Home
  </a>

  <a href="products.html">
    <i class="fa-solid fa-shirt"></i>
    Products
  </a>

  <a href="customer.html">
    <i class="fa-solid fa-user"></i>
    Customer
  </a>

  <a href="billing.html">
    <i class="fa-solid fa-calculator"></i>
    Billing
  </a>

  <a href="invoice.html">
    <i class="fa-solid fa-file-invoice"></i>
    Invoice
  </a>

</div>
    </div>

    <!-- Add Product -->
    <div class="section">

      <div class="section-title">
        Add Product
      </div>

      <div class="form-area">

        <div class="input-group">
          <label>Product Name</label>
          <input type="text" id="productName" placeholder="Enter product name">
        </div>

        <div class="input-group">
          <label>Price (₹)</label>
          <input type="number" id="price" placeholder="Enter price">
        </div>

        <div class="input-group">
          <label>Quantity</label>
          <input type="number" id="qty" placeholder="Enter quantity">
        </div>

        <button class="add-btn" onclick="addProduct()">
          <i class="fa-solid fa-plus"></i> Add
        </button>

      </div>
    </div>

    <!-- Product List -->
    <div class="section">

      <div class="section-title">
        <i class="fa-solid fa-list"></i> Product List
      </div>

      <div class="table-container">

        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Product Name</th>
              <th>Price (₹)</th>
              <th>Qty</th>
              <th>Total (₹)</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="productTable">

          </tbody>
        </table>

      </div>

      <div class="total-box">
        Grand Total: ₹<span id="grandTotal">0</span>
      </div>
      <div class="proceed-area">

  <button class="proceed-btn" onclick="goToPage('customer.html')">

    <i class="fa-solid fa-arrow-right"></i>
    Proceed

  </button>

</div>

    </div>

  </div>

  <!-- JS -->
  <script src="../js/product.js"></script>

</body>
</html>

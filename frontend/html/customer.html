<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FabricBill - Customer</title>

  <!-- CSS -->
  <link rel="stylesheet" href="customer.css">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

  <div class="container">

    <!-- Navbar -->
    <div class="navbar">

      <div class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-scissors"></i>
        </div>

        <div class="logo-text">
          <h2>FabricBill</h2>
          <p>Cloth Billing System</p>
        </div>
      </div>

      <div class="menu">

  <button onclick="goToPage('index.html')">
    <i class="fa-solid fa-house"></i> Home
  </button>

  <button onclick="goToPage('products.html')">
    <i class="fa-solid fa-shirt"></i> Products
  </button>

  <button onclick="goToPage('customer.html')">
    <i class="fa-solid fa-user"></i> Customer
  </button>

  <button onclick="goToPage('billing.html')">
    <i class="fa-solid fa-file-invoice"></i> Billing
  </button>

  <button onclick="goToPage('invoice.html')">
    <i class="fa-solid fa-receipt"></i> Invoice
  </button>

</div>

    </div>

    <!-- Customer Form -->
    <div class="form-section">

      <div class="form-title">
        <i class="fa-solid fa-user-plus"></i>
        Customer Details
      </div>

      <form id="customerForm">

        <div class="input-group">
          <label>Customer Name</label>
          <input type="text" id="name" placeholder="Enter customer name">
          <small id="nameError"></small>
        </div>

        <div class="input-group">
          <label>Mobile Number</label>
          <input type="text" id="mobile" placeholder="Enter mobile number">
          <small id="mobileError"></small>
        </div>

        <div class="input-group">
          <label>Address</label>
          <textarea id="address" rows="4" placeholder="Enter address"></textarea>
          <small id="addressError"></small>
        </div>

        <div class="btn-group">
          <button type="submit" class="save-btn">
            <i class="fa-solid fa-check"></i>
            Save Customer
          </button>

          <button type="reset" class="reset-btn">
            Reset
          </button>
        </div>

      </form>

    </div>

  </div>

  <!-- JS -->
  <script src="customer.js"></script>

</body>
</html>
